- name: Text Redactor
  slug: text-redactor
  live: true
  input: Text
  description: Paste any text and get back a clean copy with personal data masked. Choose what to hide, from names to dates to IDs.
  model: Named-entity recognition

- name: Face Blur
  slug: face-blur
  live: true
  input: Image
  description: Detect every face in a photo and blur, pixelate or black it out. Click a face to keep it visible.
  model: Face detection

- name: PDF Redactor
  slug: pdf-redactor
  live: true
  input: PDF
  description: Find names, emails, account numbers and addresses in a PDF, then burn in true black-bar redactions. The hidden text is removed, not just covered.
  model: Named-entity recognition

- name: Video Face Blur
  slug: video-face-blur
  live: true
  input: Video
  description: Track faces frame by frame and blur them through a whole clip. Export the result without an upload.
  model: Face detection + tracking

- name: Secrets Scrubber
  slug: secrets-scrubber
  live: true
  input: Code / Logs
  description: Remove API keys, passwords, tokens, IP addresses and internal hostnames from logs and code before you share them.
  model: Pattern rules

- name: Screenshot Redactor
  slug: screenshot-redactor
  input: Image
  description: Drop in a screenshot. The tool reads the text on screen and covers emails, phone numbers, usernames and tokens.
  model: OCR + entity detection

- name: License Plate Blur
  slug: plate-blur
  input: Image
  description: Find and hide vehicle license plates in street photos and dashcam stills.
  model: Object detection

- name: ID Document Redactor
  slug: id-redactor
  input: Image
  description: Mask the sensitive fields on passports, driving licenses and ID cards, such as numbers, birth dates and machine-readable zones.
  model: Layout detection + OCR

- name: Audio Bleeper
  slug: audio-bleeper
  input: Audio
  description: Transcribe a recording on your device, find names and numbers, and bleep or silence them in the audio.
  model: Speech-to-text

- name: Chat Anonymizer
  slug: chat-anonymizer
  input: Text
  description: Replace every person in a chat export with a consistent pseudonym, so the conversation still reads correctly.
  model: Named-entity recognition

- name: CSV Anonymizer
  slug: csv-anonymizer
  input: Spreadsheet
  description: Detect columns that hold personal data and mask, hash or fake them. Keep the shape of the data for testing.
  model: Column classifier

- name: Redaction Checker
  slug: redaction-checker
  input: PDF
  description: Test a redacted PDF for leaks. Find text under black boxes, old revisions and metadata that others missed.
  model: Document analysis

- name: Metadata Stripper
  slug: metadata-stripper
  input: Any file
  description: Remove GPS location, camera details, author names and edit history from photos and documents.
  model: No model needed

- name: Signature Redactor
  slug: signature-redactor
  input: Image / PDF
  description: Detect handwritten signatures, initials and stamps on scanned pages and cover them.
  model: Object detection

- name: Document Scan Redactor
  slug: scan-redactor
  input: Image / PDF
  description: Read scanned letters, invoices and forms, then redact personal data straight on the page image.
  model: OCR + entity detection

- name: Street View Cleaner
  slug: street-cleaner
  input: Image
  description: Blur faces, plates and house numbers together in one pass, for travel and real estate photos.
  model: Multi-object detection
